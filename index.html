
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Triki — Łapacz</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}
h1{margin:14px 0 6px;font-size:26px}
p{margin:8px}
button{padding:12px 18px;border:0;border-radius:10px;background:#27c7a0;color:#06251e;font-size:16px;font-weight:bold;margin:5px}
#game{display:block;width:100%;max-width:500px;height:60vh;min-height:350px;margin:12px auto;background:#19283d;border-radius:14px;touch-action:none}
.info{font-size:18px}
#status{font-size:14px;color:#aabbd0}
</style>
</head>
<body>
<h1>🎮 Łapacz</h1>
<p id="status">Połącz Triki, aby zacząć</p>
<button id="connect">Połącz z Triki</button>
<button id="start">Start / Restart</button>
<p class="info">Punkty: <b id="score">0</b> | Życia: <b id="lives">3</b></p>
<canvas id="game"></canvas>
<p>Poruszaj Triki w lewo i prawo, aby łapać kółka.</p>

<script>
"use strict";

const SERVICE_UUID="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const TX_UUID="6e400003-b5a3-f393-e0a9-e50e24dcca9e";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");
const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");

let device,rx,tx;
let score=0,lives=3,running=false;
let playerX=0;
let targetX=0;
let lastMove=0;
let objects=[];
let lastSpawn=0;
let lastTime=0;

function resize(){
  const r=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function W(){return canvas.getBoundingClientRect().width}
function H(){return canvas.getBoundingClientRect().height}

function draw(){
  const w=W(),h=H();
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#19283d";
  ctx.fillRect(0,0,w,h);

  ctx.fillStyle="#253b56";
  for(let y=25;y<h;y+=45){
    ctx.fillRect(0,y,w,1);
  }

  for(const o of objects){
    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fillStyle=o.good?"#ffd166":"#ff5470";
    ctx.fill();
  }

  const pw=Math.max(55,w*0.17),ph=16;
  ctx.fillStyle="#27c7a0";
  ctx.beginPath();
  ctx.roundRect(playerX-pw/2,h-38,pw,ph,8);
  ctx.fill();

  if(!running){
    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="bold 22px Arial";
    ctx.fillText(lives===0?"Koniec gry!":"ŁAP KÓŁKA!",w/2,h/2-8);
    ctx.font="15px Arial";
    ctx.fillText(lives===0?"Naciśnij Restart":"Naciśnij Start",w/2,h/2+20);
  }
}

function reset(){
  score=0;lives=3;objects=[];
  playerX=W()/2;targetX=playerX;
  lastSpawn=0;lastTime=0;
  scoreEl.textContent=score;
  livesEl.textContent=lives;
  running=true;
  requestAnimationFrame(loop);
}

function loop(t){
  if(!running){draw();return}
  if(!lastTime)lastTime=t;
  const dt=Math.min((t-lastTime)/16.67,2);
  lastTime=t;

  const w=W(),h=H();
  playerX+=(targetX-playerX)*Math.min(1,0.18*dt);
  playerX=Math.max(28,Math.min(w-28,playerX));

  if(t-lastSpawn>650){
    objects.push({
      x:20+Math.random()*(w-40),
      y:-15,r:10+Math.random()*5,
      speed:2.1+Math.random()*1.7,
      good:Math.random()>0.22
    });
    lastSpawn=t;
  }

  const pw=Math.max(55,w*0.17);
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    o.y+=o.speed*dt;
    if(o.y+o.r>=h-38&&o.y-o.r<=h-22&&Math.abs(o.x-playerX)<pw/2+o.r){
      if(o.good)score++;
      else lives--;
      objects.splice(i,1);
      scoreEl.textContent=score;
      livesEl.textContent=lives;
      if(lives<=0){
        running=false;
        statusEl.textContent="Koniec gry — naciśnij Restart";
        break;
      }
    }else if(o.y-o.r>h){
      if(o.good)lives--;
      objects.splice(i,1);
      livesEl.textContent=lives;
      if(lives<=0){
        running=false;
        statusEl.textContent="Koniec gry — naciśnij Restart";
        break;
      }
    }
  }
  draw();
  if(running)requestAnimationFrame(loop);
}

function moveFromPacket(bytes){
  // Szukamy takiej samej przykładowej ramki jak w testerze.
  for(let i=0;i+13<bytes.length;i++){
    if(bytes[i]!==0x22||bytes[i+1]>1)continue;
    const v=new DataView(bytes.buffer,bytes.byteOffset+i,14);
    const gx=v.getInt16(2,true);
    const gy=v.getInt16(4,true);
    const gz=v.getInt16(6,true);
    const ax=v.getInt16(8,true);
    const ay=v.getInt16(10,true);
    const az=v.getInt16(12,true);

    // Używamy osi o największej zmianie.
    // Kierunek można dostroić po pierwszym teście.
    const vals=[ax,ay,az,gx,gy,gz];
    let best=0;
    for(let j=1;j<vals.length;j++){
      if(Math.abs(vals[j])>Math.abs(vals[best]))best=j;
    }
    const val=vals[best];
    if(Math.abs(val)>2500){
      const now=Date.now();
      if(now-lastMove>100){
        targetX+=(val>0?1:-1)*W()*0.12;
        targetX=Math.max(28,Math.min(W()-28,targetX));
        lastMove=now;
      }
    }
    return;
  }
}

async function connect(){
  try{
    if(!navigator.bluetooth)throw new Error("Bluefy nie udostępnia Web Bluetooth");
    statusEl.textContent="Wybierz Triki…";
    device=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:"Triki"}],
      optionalServices:[SERVICE_UUID]
    });
    device.addEventListener("gattserverdisconnected",()=>{
      statusEl.textContent="Rozłączono";
    });
    statusEl.textContent="Łączenie…";
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    rx=await service.getCharacteristic(RX_UUID);
    tx=await service.getCharacteristic(TX_UUID);
    await tx.startNotifications();
    tx.addEventListener("characteristicvaluechanged",e=>{
      const v=e.target.value;
      moveFromPacket(new Uint8Array(v.buffer,v.byteOffset,v.byteLength));
    });
    await rx.writeValue(new Uint8Array([0x20,0x10,0x00,0xD0,0x07,0x68,0x00,0x03]));
    statusEl.textContent="Połączono! Poruszaj Triki.";
  }catch(e){
    statusEl.textContent="Błąd: "+e.message;
  }
}

document.getElementById("connect").addEventListener("click",connect);
document.getElementById("start").addEventListener("click",reset);

// Awaryjne sterowanie dotykiem, jeśli czujniki wymagają kalibracji.
canvas.addEventListener("touchmove",e=>{
  const r=canvas.getBoundingClientRect();
  targetX=e.touches[0].clientX-r.left;
  e.preventDefault();
},{passive:false});

canvas.addEventListener("click",e=>{
  const r=canvas.getBoundingClientRect();
  targetX=e.clientX-r.left;
});

playerX=W()/2;targetX=playerX;
draw();
</script>
</body>
</html>
